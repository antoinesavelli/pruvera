[project]
name = "agent-testing"
version = "0.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 14  # the owner's hard ceiling is CCN < 15

[tool.ruff.lint.per-file-ignores]
# Catalogue data: long prose strings (issue summaries, planted code), not logic.
"bench/issues/seed.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
# The harness's own venv has no pandas stubs; synthdata runs under the fixture venv.
module = ["pandas", "pandas.*", "numpy", "numpy.*", "yaml"]
ignore_missing_imports = true
